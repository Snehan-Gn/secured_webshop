<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Shop - Administration</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div id="topbar"></div>

    <main>
      <section class="hero">
        <div class="container">
          <h1>Administration</h1>
          <p class="hero-text">Gestion des utilisateurs</p>
        </div>
      </section>

      <section class="admin-section">
        <div class="container">
          <h2>Liste des utilisateurs</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Email</th>
                <th>Rôle</th>
                <th>Statut</th>
                <th>Adresse</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="user-table-body">
              <tr>
                <td colspan="7">Chargement...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer id="contact" class="footer">
      <div class="container">
        <p>Projet pédagogique - ETML 183</p>
      </div>
    </footer>

    <script src="/js/nav.js"></script>
    <script src="/js/auth.js"></script>
    <script>
      const tbody = document.getElementById("user-table-body");

      async function unlockUser(id) {
        const res = await fetchWithAuth(`/api/admin/users/${id}/unlock`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || "Erreur");
          return;
        }
        loadUsers();
      }

      async function loadUsers() {
        if (!getAccessToken()) {
          tbody.innerHTML =
            '<tr><td colspan="7" style="color:red">Erreur : Vous devez être connecté pour accéder à cette page.</td></tr>';
          return;
        }
        try {
          const r = await fetchWithAuth("/api/admin");
          if (r.status === 403) throw new Error("Accès refusé : Droits insuffisants");
          if (!r.ok) throw new Error("Erreur lors de la récupération des données");
          const users = await r.json();
          tbody.innerHTML = users
            .map((u) => {
              const locked = u.is_locked === 1 || u.is_locked === true;
              const status = locked
                ? `<span class="badge-locked">Verrouillé</span>`
                : `<span class="badge-active">Actif</span>`;
              const unlockBtn = locked
                ? `<button type="button" class="cta" data-unlock="${u.id}">Débloquer</button>`
                : "—";
              return `
              <tr>
                  <td>${u.id}</td>
                  <td>${u.username}</td>
                  <td>${u.email}</td>
                  <td><strong>${u.role}</strong></td>
                  <td>${status}</td>
                  <td>${u.address || "-"}</td>
                  <td>${unlockBtn}</td>
              </tr>`;
            })
            .join("");

          tbody.querySelectorAll("[data-unlock]").forEach((btn) => {
            btn.addEventListener("click", () => unlockUser(btn.dataset.unlock));
          });
        } catch (err) {
          tbody.innerHTML =
            `<tr><td colspan="7" style="color:red">Erreur : ${err.message}</td></tr>`;
        }
      }

      loadUsers();
    </script>
  </body>
</html>
